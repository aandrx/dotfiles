# Minimal hyprlock example.
# Docs: https://wiki.hypr.land/Configuring/Hyprlock/

source = colors.conf

general {
    fractional_scaling = 2
    immediate_render = true
}

background {
    monitor =
    # Point this at your wallpaper, or use "screenshot" for the desktop.
    path = ~/Pictures/wallpaper.png
    color = $background

    blur_size = 3
    blur_passes = 2
    noise = 0.0117
    contrast = 1.3
    brightness = 0.6
    vibrancy = 0.21
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H:%M") </big></b>"
    color = $foreground
    font_size = 96
    font_family = sans-serif
    position = 0, 220
    halign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "<b> $(date +"%A, %e %B") </big></b>"
    color = $on_surface_variant
    font_size = 24
    font_family = sans-serif
    position = 0, 140
    halign = center
}

# Password field
input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    outer_color = $primary
    inner_color = $surface
    font_color = $foreground
    fade_on_empty = true
    placeholder_text = <i>password…</i>
    position = 0, -60
    halign = center
    valign = center
}
