Section "InputClass"
    Identifier "Touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "AccelProfile" "flat"       # disables acceleration
    Option "AccelSpeed" "0.0"          # fine-tune pointer speed
    Option "Tapping" "on"              # enable tap-to-click
    Option "DisableWhileTyping" "on"   # avoid accidental touches
    Option "NaturalScrolling" "on"     # optional
EndSection

