general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = pidof hyprlock || hyprlock   # lock before suspend (niri has no ScreenSaver.Lock).
    after_sleep_cmd = niri msg action power-on-monitors  # avoid having to press a key twice to turn on the display.
}

# === MONITOR DIM ===
listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# === LOCKSCREEN ===
listener {
    timeout = 300                                 # 5min
    on-timeout = pidof hyprlock || hyprlock       # lock screen when timeout has passed
}

# === TURN OFF SCREEN ===
listener {
    timeout = 330                                                     # 5.5min
    on-timeout = niri msg action power-off-monitors                   # screen off when timeout has passed
    on-resume = niri msg action power-on-monitors && brightnessctl -r # screen on when activity is detected after timeout has fired.
}

# === SUSPEND ===
listener {
    timeout = 1800                                # 30min
    on-timeout = systemctl suspend                # suspend pc
}
