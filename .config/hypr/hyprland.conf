# Minimal Hyprland configuration example.
#
# Trimmed for reading: adjust the monitor to your panel, replace the programs
# with the ones you use, and grow it from the upstream defaults.
# Docs: https://wiki.hypr.land/Configuring/

source = colors.conf

# Replace with the output name from `hyprctl monitors`.
monitorv2 {
    output = eDP-1
    mode = 1920x1200@60
    position = 0x0
    scale = 1
}

$mainMod = SUPER
$terminal = kitty
$menu = rofi -show drun

exec-once = waybar
exec-once = swaync
exec-once = hypridle

env = XCURSOR_SIZE,24

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = $primary
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 8

    blur {
        enabled = true
        size = 3
        passes = 2
    }
}

animations {
    enabled = true
    bezier = easeOut, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 4, easeOut
    animation = fade, 1, 4, default
    animation = workspaces, 1, 5, easeOut
}

input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }
}

# Window rules: float a dialog, dim a utility window.
windowrule {
    name = float-nm-applet
    float = on
    match:class = ^(nm-applet)$
}

windowrule {
    name = dim-pavucontrol
    opacity = 0.8
    size = 900 506
    match:class = ^(pavucontrol)$
}

# Layer rule: blur the bar's surface.
layerrule {
    name = blur-waybar
    blur = on
    ignore_alpha = 0.5
    match:namespace = waybar
}

# Binds, see https://wiki.hypr.land/Configuring/Binds/
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, V, togglefloating
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
