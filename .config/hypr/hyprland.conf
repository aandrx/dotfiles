# Minimal Hyprland configuration example.
#
# Split the way the author runs it: one file per concern, sourced from here.
# Trimmed for reading — adjust the monitor, replace the programs with your own,
# and grow it from the upstream defaults.
# Docs: https://wiki.hypr.land/Configuring/

source = colors.conf

# Replace with the output name from `hyprctl monitors`.
monitorv2 {
    output = eDP-1
    mode = 1920x1200@60
    position = 0x0
    scale = 1
}

$mainMod = SUPER
$terminal = kitty
$menu = rofi -show drun

exec-once = waybar
exec-once = swaync
exec-once = hypridle

env = XCURSOR_SIZE,24

source = configs/looknfeel.conf
source = configs/input.conf
source = configs/windowrules.conf
source = configs/keybinds.conf
