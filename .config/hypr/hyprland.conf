source = colors.conf

### MONITORS ###

# See https://wiki.hypr.land/Configuring/Monitors/
# monitor = eDP-1, 1920x1080@60, 0x0, 1
monitorv2 {
  output = eDP-1
  mode = 1920x1200@60
  position = 0x0
  scale = 1
  transform =0
}
#monitor = HDMI-A-2, 2160x1440@120, -1920x0, 1
#monitor = HDMI-A-2, 2160x1440@120, 0x-1080, 1
#monitor = HDMI-A-2, 1920x1080@60, 0x-1080, 1
monitor = HDMI-A-2, 1920x1080@144, 0x-1080, 1

### MY PROGRAMS ###

$terminal = kitty
$fileManager = nautilus # thunar was the old one 
$menu = rofi -show drun
$music = spotify
$browser = firefox

### AUTOSTART ###

# Autostart necessary processes (like notifications daemons, status bars, etc.)

exec-once = $terminal
exec-once = nm-applet
#exec-once = waybar
exec-once = sleep 1 && waybar
exec-once = awww-daemon
exec-once = sleep 1 && awww restore
exec-once = swaync
exec-once = systemctl --user start hyprpolkitagent
exec-once = hypridle
exec-once = hyprpm reload -n &
exec-once = hyprpaper & 
exec-once = firefox &
#exec-once = sudo tlp start
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets,ssh

### ENVIRONMENT VARIABLES ###

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
# Inherit PATH from the session; configure host-specific paths in the login shell.

### PERMISSIONS ###

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

# tags
# source= ~/.config/hypr/configs/tags.conf

### LOOK AND FEEL ###

source= ~/.config/hypr/configs/looknfeel.conf

# animations

source= ~/.config/hypr/configs/UserAnimations.conf

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}

plugin {
  split-monitor-workspaces {
    count = 3
    keep_focused = 1
    enable_notifications = 0
    enable_persistent_workspaces = 1
    enable_wrapping = 1

    monitor_priority = eDP-1, HDMI-A-2
    max_workspaces = eDP-1, 3
#    max_workspaces = HDMI-A-2, 3
  }
}

### INPUT ###
source= ~/.config/hypr/configs/input.conf

source= ~/.config/hypr/configs/windowrules.conf

### KEYBINDINGS ###
source= ~/.config/hypr/configs/keybinds.conf

### WINDOWS AND WORKSPACES ###
source= ~/.config/hypr/configs/windowrules.conf

