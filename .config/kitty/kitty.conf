# kitty example: font, opacity, scrolling, shell and the palette.
# Docs: https://sw.kovidgoyal.net/kitty/conf/

font_family JetBrainsMono NF Bold
font_size 12.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9
confirm_os_window_close 0

cursor_trail 1
linux_display_server auto

scrollback_lines 2000
wheel_scroll_min_lines 1

shell zsh
enable_audio_bell no
window_padding_width 4

# Palette. On the author's machine matugen writes this from the wallpaper
# ([templates.kitty] in ../matugen/config.toml), so the real file is generated.
include colors.conf
